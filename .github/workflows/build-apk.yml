name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Prepare stable test signing key
        run: |
          base64 --decode .github/debug.keystore.base64 > app/debug.keystore
          test -s app/debug.keystore

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK output
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: menufigures-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="printer-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
            --target "$GITHUB_SHA" \
            --title "MenuFigures Printer APK build ${GITHUB_RUN_NUMBER}" \
            --notes "Android debug APK for MenuFigures Printer. Built from commit ${GITHUB_SHA}. Install for testing; printer compatibility still requires a physical printer test."
